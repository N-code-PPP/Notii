name: Android CI Build & Sign

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

jobs:
  build:
    name: Build Signed Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare Environment (.env) and Signing Keystores
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_WEB_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/prepare-github-build.sh
          ./scripts/prepare-github-build.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Signed Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Signed Release APK & Bundle (AAB)
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Upload Signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notii-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: Notii-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
