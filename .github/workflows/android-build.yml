name: Android CI Build & Sign

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

jobs:
  build:
    name: Build Signed Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Licenses & Platform 36.1
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          mkdir -p "$SDK_DIR/licenses"
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          504667f4c0de7af1a06de9f4b1727b84351f2910
          EOF
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$SDK_DIR/licenses/android-googlexr-license"
          printf "\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
          printf "\n3a7848b1d7366ca5cfa0be477627644ca73f47e3\n" > "$SDK_DIR/licenses/microxr-sysimage-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$SDK_DIR/licenses/mips-android-sysimage-license"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Prepare Environment (.env) and Signing Keystores
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_WEB_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/prepare-github-build.sh || true
          ./scripts/prepare-github-build.sh || true

          # Direct inline fallback to guarantee keystores exist on disk in workspace root
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < "debug.keystore.base64" | base64 -d > "debug.keystore"
          fi

          if [ -n "${KEYSTORE_BASE64_SECRET:-}" ]; then
            printf "%s" "$KEYSTORE_BASE64_SECRET" | tr -d '[:space:]' | base64 -d > "my-upload-key.jks"
          elif [ ! -f "my-upload-key.jks" ] && [ -f "my-upload-key.jks.base64" ]; then
            tr -d '[:space:]' < "my-upload-key.jks.base64" | base64 -d > "my-upload-key.jks"
          fi

          if [ -n "${GOOGLE_SERVICES_JSON_SECRET:-}" ]; then
            printf "%s" "$GOOGLE_SERVICES_JSON_SECRET" | tr -d '[:space:]' | base64 -d > "app/google-services.json"
          elif [ ! -f "app/google-services.json" ] && [ -f "app/google-services.json.base64" ]; then
            tr -d '[:space:]' < "app/google-services.json.base64" | base64 -d > "app/google-services.json"
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp ".env.example" ".env"
          fi

          # Verify required build and signing files are present before Gradle is invoked
          echo "Checking required files:"
          ls -la debug.keystore my-upload-key.jks app/google-services.json .env


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Signed Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Signed Release APK & Bundle (AAB)
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Upload Signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notii-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: Notii-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
